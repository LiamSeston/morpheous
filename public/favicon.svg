<!--
  public/favicon.svg — Blackletter Initial seal mark.

  The "M" is a real vector <path>, extracted from the actual Pirata One
  glyph outline with opentype.js (see scripts/extract-favicon-glyph.js) —
  not live text set in the webfont. Favicons render in a more restricted
  context than a normal page (Safari, pinned tabs, OS icon caches) where
  @font-face frequently fails to load, so this has no runtime font
  dependency at all. See FAVICON.md.

  Colors invert for OS-level dark mode via a plain media query (no font
  needed for that either) so it still reads on a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .ink { fill: #171310; }
    .ink-line { stroke: #171310; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E7E1D2; }
      .ink-line { stroke: #E7E1D2; }
    }
  </style>
