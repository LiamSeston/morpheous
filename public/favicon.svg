<!--
  public/favicon.svg — the 7-point star seal, v3.

  v3 fixes a bug where the mark rendered as a thin, disconnected-looking
  spindle at small (favicon/nav) sizes: rays now share one consistent
  path formula (no mirroring-induced winding mismatch) and a solid center
  hub means everything connects through something solid instead of a
  bare point.

  Pure vector path — no @font-face or text dependency, so unlike the
  earlier blackletter-M version this renders identically everywhere SVG
  favicons are supported (Safari, pinned tabs, OS icon caches included).
  See FAVICON.md.

  Colors invert for OS-level dark mode via a plain media query (no font
  needed for that either) so it still reads on a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .ink { fill: #171310; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E7E1D2; }
    }
  </style>
  <circle class="ink" cx="12" cy="12" r="2.5"/>
  <path class="ink" d="M12,12 L14.3,12 L12,1 L9.7,12 Z M12,12 L13.432,13.800 L20.609,5.152 L10.568,10.200 Z M12,12 L11.488,14.242 L22.724,14.448 L12.512,9.758 Z M12,12 L9.928,12.998 L16.773,21.911 L14.072,11.002 Z M12,12 L9.928,11.002 L7.227,21.911 L14.072,12.998 Z M12,12 L11.488,9.758 L1.276,14.448 L12.512,14.242 Z M12,12 L13.432,10.200 L3.391,5.152 L10.568,13.800 Z"/>
</svg>
