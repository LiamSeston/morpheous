<!--
  public/favicon.svg — the 7-point star seal, flat-cut ray tips.

  Pure vector path — no @font-face or text dependency, so unlike the
  earlier blackletter-M version this renders identically everywhere SVG
  favicons are supported (Safari, pinned tabs, OS icon caches included).
  See FAVICON.md.

  Colors invert for OS-level dark mode via a plain media query (no font
  needed for that either) so it still reads on a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .ink { fill: #171310; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E7E1D2; }
    }
  </style>
  <path class="ink" d="M12,12 L13.4,12 L12.5,2 L11.5,2 L10.6,12 Z M12,12 L12.87,13.09 L20.13,6.16 L19.51,5.38 L11.13,10.91 Z M12,12 L11.69,13.365 L21.64,14.72 L21.86,13.74 L12.31,10.635 Z M12,12 L10.74,12.61 L15.89,21.22 L16.79,20.78 L13.26,11.39 Z M12,12 L13.26,12.61 L8.11,21.22 L7.21,20.78 L10.74,11.39 Z M12,12 L12.31,13.365 L2.14,13.74 L2.36,14.72 L11.69,10.635 Z M12,12 L11.13,13.09 L3.87,6.16 L4.49,5.38 L12.87,10.91 Z"/>
</svg>
